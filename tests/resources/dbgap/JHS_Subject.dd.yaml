    label: Health/Medical/Biomedical (IRB, NPU) (HMB-IRB-NPU)
  - code: '2'
    label: Disease-Specific (Focused Disease Only, IRB, NPU) (DS-FDO-IRB-NPU)
  - code: '3'
    label: Health/Medical/Biomedical (IRB) (HMB-IRB)
  - code: '4'
    label: Disease-Specific (Focused Disease Only, IRB) (DS-FDO-IRB)
